<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoNewsNow — Noticias de Ciencia y Tecnología</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header class="app-header">
      <button class="header-btn sidebar-toggle" id="sidebarToggle" type="button" title="Mostrar u ocultar la barra lateral" aria-label="Mostrar u ocultar la barra lateral" aria-expanded="true" aria-controls="sidebar">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand">
        <span class="brand-icon"><i class="fas fa-newspaper"></i></span>
        <span class="brand-name">InfoNews<span class="brand-accent">Now</span></span>
      </div>

      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" placeholder="Buscar noticias, temas, fuentes..." autocomplete="off">
      </div>

      <div class="header-spacer"></div>
      <span class="header-date" id="headerDate"></span>

      <button class="header-btn" id="favViewBtn" title="Mis favoritos" aria-label="Ver artículos guardados">
        <i class="fas fa-bookmark"></i>
        <span class="fav-count" id="favCount">0</span>
      </button>
    </header>

    <!-- Tab Bar -->
    <nav class="tab-bar" id="tabBar">
      <button class="tab active" data-category="technology">
        <span class="tab-icon"><i class="fas fa-microchip"></i></span>
        Tecnología
      </button>
      <button class="tab" data-category="science">
        <span class="tab-icon"><i class="fas fa-flask"></i></span>
        Ciencia
      </button>
      <button class="tab" data-category="colombia">
        <span class="tab-icon"><i class="fas fa-flag"></i></span>
        Colombia
      </button>
      <button class="tab" data-category="world">
        <span class="tab-icon"><i class="fas fa-globe-americas"></i></span>
        Mundo
      </button>
      <button class="tab" data-category="business">
        <span class="tab-icon"><i class="fas fa-chart-line"></i></span>
        Negocios
      </button>
      <button class="tab" data-category="sports">
        <span class="tab-icon"><i class="fas fa-futbol"></i></span>
        Deportes
      </button>
      <button class="tab" data-category="gaming">
        <span class="tab-icon"><i class="fas fa-gamepad"></i></span>
        Gaming
      </button>
      <button class="tab" data-category="health">
        <span class="tab-icon"><i class="fas fa-heartbeat"></i></span>
        Salud
      </button>
      <button class="tab" data-category="general">
        <span class="tab-icon"><i class="fas fa-layer-group"></i></span>
        Todas
      </button>
      <div class="tab-spacer"></div>
      <button class="tab refresh-btn" id="refreshBtn" title="Recargar">
        <span class="tab-icon"><i class="fas fa-sync-alt"></i></span>
      </button>
    </nav>

    <!-- Ticker -->
    <div class="ticker" id="ticker">
      <span class="ticker-label"><span class="live-dot"></span> Últimas</span>
      <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <div class="main-layout">

      <!-- Sidebar -->
      <button class="sidebar-handle" id="sidebarHandle" type="button" title="Ocultar o mostrar el panel lateral" aria-label="Ocultar o mostrar el panel lateral"><i class="fas fa-chevron-left"></i></button>

      <aside class="sidebar" id="sidebar">
        <!-- Favoritos -->
        <section class="sidebar-block" data-block="favs">
          <button class="section-header section-toggle" type="button" aria-expanded="true" aria-controls="blockFavs">
            <span class="section-title">Favoritos <span class="section-count" id="favSideCount">0</span></span>
            <i class="fas fa-chevron-down section-chevron" aria-hidden="true"></i>
          </button>
          <div class="sidebar-collapse" id="blockFavs"><div class="sidebar-collapse-inner">
            <div class="sidebar-item" data-action="favorites-view">
              <span class="si-icon"><i class="fas fa-bookmark"></i></span>
              ver guardados
            </div>
            <div class="fav-list" id="favList">
              <div class="fav-empty">Sin artículos guardados</div>
            </div>
          </div></div>
        </section>

        <!-- Fuentes directas -->
        <section class="sidebar-block" data-block="sources">
          <button class="section-header section-toggle" type="button" aria-expanded="true" aria-controls="blockSources">
            <span class="section-title">Para estar más informado</span>
            <i class="fas fa-chevron-down section-chevron" aria-hidden="true"></i>
          </button>
          <div class="sidebar-collapse" id="blockSources"><div class="sidebar-collapse-inner">
            <div class="sources-list" id="sourcesList"></div>
          </div></div>
        </section>

        <!-- Estado -->
        <section class="sidebar-block" data-block="status">
          <button class="section-header section-toggle" type="button" aria-expanded="true" aria-controls="blockStatus">
            <span class="section-title">Estado</span>
            <i class="fas fa-chevron-down section-chevron" aria-hidden="true"></i>
          </button>
          <div class="sidebar-collapse" id="blockStatus"><div class="sidebar-collapse-inner">
            <div class="status-panel" id="statusPanel">
              <div class="stat-row">
                <span class="stat-label">Solicitudes</span>
                <span class="stat-value" id="requestCount">0/100 hoy</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Artículos</span>
                <span class="stat-value" id="articleCount">0</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Caché</span>
                <span class="stat-value" id="cacheStatus">—</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Estado</span>
                <span class="stat-value green" id="apiStatus">—</span>
              </div>
            </div>
          </div></div>
        </section>
      </aside>

      <!-- Content -->
      <main class="content">
        <div class="content-inner">
          <div class="content-header">
            <div class="page-heading">
              <h1 class="page-title" id="currentCategoryLabel">Tecnología</h1>
              <span class="page-count" id="resultCount">0 artículos</span>
            </div>
            <div class="view-controls">
              <button class="view-btn active" id="viewGrid" title="Cuadrícula" aria-label="Vista de cuadrícula"><i class="fas fa-th"></i></button>
              <button class="view-btn" id="viewList" title="Lista" aria-label="Vista de lista"><i class="fas fa-list"></i></button>
            </div>
          </div>

          <!-- Loading Skeleton -->
          <div class="skeleton-grid" id="skeletonGrid">
            <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line w-80"></div><div class="sk-line w-60"></div><div class="sk-line w-40"></div></div>
            <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line w-80"></div><div class="sk-line w-60"></div><div class="sk-line w-40"></div></div>
            <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line w-80"></div><div class="sk-line w-60"></div><div class="sk-line w-40"></div></div>
            <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line w-80"></div><div class="sk-line w-60"></div><div class="sk-line w-40"></div></div>
            <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line w-80"></div><div class="sk-line w-60"></div><div class="sk-line w-40"></div></div>
            <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line w-80"></div><div class="sk-line w-60"></div><div class="sk-line w-40"></div></div>
          </div>

          <!-- Error Banner -->
          <div class="error-banner" id="errorBanner" style="display:none">
            <span class="error-icon"><i class="fas fa-exclamation-triangle"></i></span>
            <span id="errorMessage">Error al cargar noticias</span>
            <button class="error-close" id="errorClose">&times;</button>
          </div>

          <!-- News Grid -->
          <div class="news-grid" id="newsGrid"></div>
        </div>
      </main>

    </div>

    <!-- Status Bar -->
    <footer class="status-bar">
      <div class="sb-left">
        <span class="sb-item sb-brand">InfoNewsNow</span>
        <span class="sb-item" id="sbConnection"><i class="fas fa-circle-notch fa-spin"></i> Conectando...</span>
      </div>
      <div class="sb-right">
        <span class="sb-item" id="sbTime"><i class="far fa-clock"></i> --:--</span>
      </div>
    </footer>

    <!-- Reader modal -->
    <div class="reader" id="readerModal" hidden>
      <div class="reader-backdrop" data-reader-close></div>
      <div class="reader-panel" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
        <header class="reader-bar">
          <div class="reader-bar-meta">
            <span class="reader-source" id="readerSource"></span>
            <span class="reader-date" id="readerDate"></span>
          </div>
          <div class="reader-bar-actions">
            <button class="reader-iconbtn" id="readerShare" type="button" title="Compartir" aria-label="Compartir"><i class="fas fa-share-alt"></i></button>
            <a class="reader-original" id="readerOriginal" href="#" target="_blank" rel="noopener noreferrer">Ver original <i class="fas fa-external-link-alt"></i></a>
            <button class="reader-iconbtn reader-close" id="readerClose" type="button" title="Cerrar" aria-label="Cerrar lector"><i class="fas fa-times"></i></button>
          </div>
        </header>
        <div class="reader-scroll" id="readerScroll">
          <div class="reader-loading" id="readerLoading">
            <div class="reader-skel reader-skel-img"></div>
            <div class="reader-skel reader-skel-title"></div>
            <div class="reader-skel reader-skel-line"></div>
            <div class="reader-skel reader-skel-line"></div>
            <div class="reader-skel reader-skel-line short"></div>
            <p class="reader-loading-text"><i class="fas fa-circle-notch fa-spin"></i> Obteniendo el artículo…</p>
          </div>
          <article class="reader-article" id="readerArticle" hidden>
            <img class="reader-hero" id="readerHero" alt="" hidden>
            <h1 class="reader-title" id="readerTitle"></h1>
            <div class="reader-byline" id="readerByline"></div>
            <div class="reader-body" id="readerBody"></div>
          </article>
          <div class="reader-fallback" id="readerFallback" hidden>
            <div class="reader-fallback-icon"><i class="fas fa-newspaper"></i></div>
            <p class="reader-fallback-reason" id="readerFallbackReason"></p>
            <p class="reader-fallback-desc" id="readerFallbackDesc"></p>
            <a class="reader-fallback-cta" id="readerFallbackLink" href="#" target="_blank" rel="noopener noreferrer">Abrir en pestaña original <i class="fas fa-arrow-right"></i></a>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
